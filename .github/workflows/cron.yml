name: Daily Meeting Bot Cron

on:
  schedule:
    # 為了避開全球 Github 伺服器的整點塞車潮，改設為每天早上 10:15 觸發 (UTC 02:15)
    - cron: '15 2 * * *'
  # 允許使用者在 GitHub 網頁上點擊按鈕手動觸發測試
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # 根據官方建議加入環境變數，提早採用 Node 24 來消除警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create Service Account JSON
        # 從 GitHub Secrets 讀取整坨 JSON 文字，並存成程式碼需要的實體檔案
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > service_account.json
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          
      - name: Run Python Script
        # 將其他環境變數注入作業系統中
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: |
          python main.py
